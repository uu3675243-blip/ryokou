<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec">
<title>旅行計画</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
<style>
:root{--bg:#f5f2ec;--card:#fff;--ink:#1f2937;--ink2:#4b5563;--mut:#94a3b8;--line:#e6e1d7;--accent:#2563eb;--accent2:#1d4ed8;--danger:#ef4444;--ok:#059669;--shadow:0 4px 14px rgba(31,41,55,.06),0 1px 3px rgba(31,41,55,.05);--shadow-lg:0 12px 30px rgba(31,41,55,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(180deg,#faf8f3 0%,#f2ede4 100%);min-height:100vh;padding-bottom:120px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.appHeader{position:sticky;top:0;z-index:50;background:rgba(250,248,243,.94);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid rgba(230,225,215,.6)}
.headInner{max-width:640px;margin:0 auto;padding:12px 14px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:6px}
.iconBtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:transparent;transition:background .15s}
.iconBtn:hover{background:rgba(31,41,55,.05)}
.iconBtn:active{background:rgba(31,41,55,.09)}
.appTitle{text-align:center;font-size:18px;font-weight:900;letter-spacing:.02em;color:var(--ink);outline:none;padding:2px 6px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appTitle:focus{background:rgba(37,99,235,.06)}
.subBar{max-width:640px;margin:0 auto;padding:0 12px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.planBtn{flex:1 1 auto;min-width:0;padding:8px 10px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--ink);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:6px;overflow:hidden}
.planBtn .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.planBtn .caret{font-size:9px;color:var(--mut);flex:0 0 auto}
.miniBtn{padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--ink2);box-shadow:var(--shadow);white-space:nowrap;flex:0 0 auto}
.miniBtn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.miniBtn.warn{color:var(--danger)}
.miniBtn:active{transform:scale(.96)}
.netInd{font-size:10px;font-weight:800;padding:4px 8px;border-radius:99px;flex:0 0 auto;white-space:nowrap}
.netInd.online{background:#dcfce7;color:#065f46}
.netInd.offline{background:#fef3c7;color:#92400e}
.netInd.saving{background:#dbeafe;color:#1e40af}
.netInd.error{background:#fee2e2;color:#991b1b}
.dayStrip{max-width:640px;margin:0 auto;padding:0 12px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.dayStrip::-webkit-scrollbar{display:none}
.dayChip{flex:0 0 auto;padding:7px 12px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;box-shadow:var(--shadow);transition:.15s}
.dayChip.act{background:var(--ink);color:#fff;border-color:var(--ink)}
.dayChip:active{transform:scale(.97)}
.dayChip.addDay{color:var(--mut);border-style:dashed;background:transparent;box-shadow:none}
.summaryRow{max-width:640px;margin:0 auto 6px;padding:0 12px;display:flex;gap:6px}
.sumPill{flex:1;min-width:0;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.sumPill .k{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.04em}
.sumPill .v{font-size:13px;font-weight:900;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shell{max-width:640px;margin:0 auto;padding:8px 12px}
.timeline{display:flex;flex-direction:column;gap:10px;position:relative}
/* ---------- カード基本 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 8px;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;position:relative}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.card.dragging{opacity:.5;transform:scale(.98)}
.card.dragOver{outline:2px dashed var(--accent);outline-offset:2px}
/* カードのグリッド構造 */
.cardGrid{display:grid;grid-template-columns:18px 40px 78px 1fr;align-items:start;gap:8px}
.dragHandle{align-self:center;color:var(--mut);cursor:grab;user-select:none;font-size:14px;line-height:1;padding:8px 0;touch-action:none;text-align:center}
.dragHandle:active{cursor:grabbing}
.cardIcon{align-self:center;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.card.dest .cardIcon{background:#fff3ef;color:#c2410c}
.card.move .cardIcon{background:#e8f0ff;color:#2563eb}
.timeCol{align-self:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.timeInput{width:100%;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:#fbfbf8;color:var(--ink);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em;transition:.15s;min-width:0}
.timeInput:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.durBadge{font-size:10px;color:var(--mut);font-weight:700;text-align:center}
.body{min-width:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.destTop{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:#fbfbf8;transition:.15s;min-width:0}
.destTop:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.destLbl{font-size:11px;font-weight:800;color:var(--ink2);flex:0 0 auto;white-space:nowrap}
.destName{flex:1;min-width:0;border:none;background:transparent;font-size:14px;font-weight:700;padding:2px 0;width:100%}
.destName:focus{outline:none}
.destNote{border:none;background:transparent;padding:2px 4px;font-size:12px;color:var(--ink2);width:100%;resize:none;line-height:1.5;font-family:inherit}
.destNote:focus{outline:none}
.mapPin{font-size:16px;color:var(--danger);flex:0 0 auto;cursor:pointer;padding:2px 4px}
.moveHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.moveLbl{font-size:13px;font-weight:900;color:var(--ink);white-space:nowrap;flex:0 0 auto}
.moveSelect{flex:1;min-width:120px;padding:8px 10px;padding-right:30px;border-radius:11px;border:1px solid var(--line);background:#fbfbf8;font-size:13px;font-weight:700;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1.5L6 6.5L11 1.5' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;transition:.15s}
.moveSelect:focus{outline:none;border-color:var(--accent);background-color:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.moveMeta{display:flex;gap:6px}
.metaGrp{flex:1;min-width:0;display:flex;align-items:center;gap:4px;padding:7px 10px;border-radius:11px;border:1px solid var(--line);background:#fbfbf8;transition:.15s;overflow:hidden}
.metaGrp:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.metaLbl{font-size:10px;color:var(--mut);font-weight:800;white-space:nowrap;flex:0 0 auto}
.metaInput{flex:1;min-width:0;width:100%;border:none;background:transparent;font-size:13px;font-weight:700;padding:2px 0;font-variant-numeric:tabular-nums}
.metaInput:focus{outline:none}
.metaUnit{font-size:10px;color:var(--mut);font-weight:700;flex:0 0 auto}
/* 削除ボタン: 上に載せない、右側に別枠で配置 */
.cardActions{position:absolute;top:6px;right:6px;display:flex;gap:2px;opacity:.6;transition:opacity .15s;z-index:2}
.card:hover .cardActions,.card:focus-within .cardActions{opacity:1}
.actBtn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);background:rgba(255,255,255,.85);transition:.15s;backdrop-filter:blur(4px)}
.actBtn:hover{background:rgba(239,68,68,.15);color:var(--danger)}
/* ---------- フッター ---------- */
.footer{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(250,248,243,0),rgba(250,248,243,.98) 30%);pointer-events:none}
.footInner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;pointer-events:auto}
.addBtn{width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;font-size:24px;font-weight:300;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);flex:0 0 auto;transition:transform .12s,background .15s}
.addBtn:hover{background:var(--accent2);transform:translateY(-2px)}
.addBtn:active{transform:scale(.94)}
.searchWrap{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:24px;background:#e9e5dc;border:1px solid rgba(0,0,0,.04);box-shadow:var(--shadow)}
.searchWrap svg{flex:0 0 auto;color:var(--mut)}
.searchInput{flex:1;min-width:0;border:none;background:transparent;font-size:13px;color:var(--ink)}
.searchInput::placeholder{color:var(--mut)}
.searchInput:focus{outline:none}
.empty{padding:36px 16px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:18px;background:#fdfcf8}
.empty .emoji{font-size:40px;margin-bottom:8px}
.empty .t{font-size:14px;font-weight:800;color:var(--ink2);margin-bottom:4px}
.empty .s{font-size:11px;line-height:1.6}
.suggest{position:fixed;left:12px;right:12px;bottom:74px;z-index:59;max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);max-height:240px;overflow-y:auto;display:none}
.suggest.show{display:block}
.sugItem{padding:10px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.sugItem:last-child{border-bottom:none}
.sugItem:hover,.sugItem:active{background:#f8f5ee}
.sugItem .emoji{font-size:18px}
.sugItem .nm{font-size:13px;font-weight:700}
.sugItem .cat{font-size:10px;color:var(--mut);margin-top:2px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);padding:10px 16px;border-radius:12px;background:#1f2937;color:#fff;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.24s;z-index:200;box-shadow:var(--shadow-lg);max-width:calc(100% - 24px);text-align:center;line-height:1.5}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modalWrap{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;z-index:300;padding:0}
.modalWrap.show{display:flex}
.modalWrap .bd{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.sheet{position:relative;background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.25);padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;animation:slideUp .22s ease-out}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet .grabber{width:40px;height:4px;background:#d1d5db;border-radius:99px;margin:0 auto 12px}
.sheet h2{font-size:16px;font-weight:900;margin-bottom:10px}
.planList{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.planItem{padding:12px;border-radius:12px;border:1px solid var(--line);background:#fbfbf8;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;transition:.12s}
.planItem:hover{background:#f8f5ee}
.planItem.act{border-color:var(--ink);background:#f5f2ec}
.planItem .info{min-width:0;flex:1}
.planItem .tt{font-size:13px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.planItem .mt{font-size:10px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.planItem .delBtn{flex:0 0 auto;width:32px;height:32px;border-radius:10px;color:var(--mut);font-size:14px;display:flex;align-items:center;justify-content:center;transition:.12s}
.planItem .delBtn:hover{background:rgba(239,68,68,.1);color:var(--danger)}
.newPlanBtn{width:100%;padding:12px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;font-weight:800;text-align:center}
.newPlanBtn:active{transform:scale(.98)}
.hlp{font-size:10px;color:var(--mut);line-height:1.6;margin-top:6px}
.loadingBox{padding:30px;text-align:center;color:var(--mut);font-size:13px}
.loadingBox .spin{display:inline-block;width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* ==================== レスポンシブ ==================== */
/* タブレット以上 */
@media(min-width:520px){
  .cardGrid{grid-template-columns:22px 44px 96px 1fr;gap:10px}
  .card{padding:14px 14px 14px 10px}
  .cardIcon{width:44px;height:44px;font-size:22px;border-radius:14px}
  .timeInput{font-size:15px;padding:9px 8px}
  .appTitle{font-size:20px}
  .headInner{grid-template-columns:44px 1fr 44px;padding:14px 16px}
  .iconBtn{width:44px;height:44px;font-size:20px;border-radius:14px}
  .miniBtn{font-size:12px;padding:8px 12px;border-radius:11px}
  .netInd{font-size:11px;padding:4px 10px}
  .dayChip{font-size:13px;padding:8px 14px;border-radius:12px}
  .sumPill .v{font-size:15px}
  .sumPill .k{font-size:10px}
  .destLbl{font-size:12px}.destName{font-size:15px}.destNote{font-size:13px}
  .moveLbl{font-size:15px}.moveSelect{font-size:14px}
  .metaLbl{font-size:11px}.metaInput{font-size:14px}
  .addBtn{width:52px;height:52px;font-size:26px}
  .searchWrap{padding:12px 16px;border-radius:26px}
  .searchInput{font-size:14px}
}
/* 小型スマホ (幅360px以下) */
@media(max-width:359px){
  .cardGrid{grid-template-columns:16px 36px 66px 1fr;gap:6px}
  .card{padding:10px 10px 10px 6px;border-radius:16px}
  .cardIcon{width:36px;height:36px;font-size:18px;border-radius:10px}
  .timeInput{font-size:12px;padding:7px 4px}
  .durBadge{font-size:9px}
  .destTop{padding:7px 8px;gap:4px}
  .destLbl{font-size:10px}
  .destName{font-size:13px}
  .destNote{font-size:11px}
  .moveLbl{font-size:12px}
  .moveSelect{font-size:12px;padding:7px 8px;min-width:100px}
  .metaGrp{padding:6px 8px;gap:3px}
  .metaLbl{font-size:9px}
  .metaInput{font-size:12px}
  .appTitle{font-size:16px}
  .headInner{padding:10px 10px;grid-template-columns:36px 1fr 36px}
  .iconBtn{width:36px;height:36px;font-size:16px}
  .sumPill{padding:7px 8px}
  .sumPill .v{font-size:12px}
  .subBar{padding:0 10px 6px;gap:4px}
  .planBtn{font-size:11px;padding:7px 8px}
  .miniBtn{font-size:10px;padding:7px 8px}
  .netInd{font-size:9px;padding:3px 6px}
}
</style>
</head>
<body>

<header class="appHeader">
  <div class="headInner">
    <button class="iconBtn" id="mapBtn" title="地図で表示">🗺️</button>
    <div class="appTitle" contenteditable="true" spellcheck="false" id="tripTitle">旅行計画</div>
    <button class="iconBtn" id="calBtn" title="日付選択">🗓️</button>
  </div>
  <div class="subBar">
    <button class="planBtn" id="planPickBtn"><span class="cur" id="planCurName">プランを選ぶ</span><span class="caret">▼</span></button>
    <button class="miniBtn" id="saveBtn" title="クラウド保存">☁ 保存</button>
    <button class="miniBtn" id="reloadBtn" title="再読み込み">🔄</button>
    <span class="netInd" id="netInd">-</span>
  </div>
  <div class="dayStrip" id="dayStrip"></div>
  <div class="summaryRow">
    <div class="sumPill"><span class="k">総費用</span><span class="v" id="sumCost">¥0</span></div>
    <div class="sumPill"><span class="k">移動時間</span><span class="v" id="sumMove">0分</span></div>
    <div class="sumPill"><span class="k">予定数</span><span class="v" id="sumCount">0</span></div>
  </div>
</header>

<main class="shell"><div class="timeline" id="timeline"></div></main>
<div class="suggest" id="suggest"></div>

<div class="footer"><div class="footInner">
  <button class="addBtn" id="addBtn" title="予定を追加">＋</button>
  <div class="searchWrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
    <input class="searchInput" id="searchInput" type="text" placeholder="新しいスポットを追加" />
  </div>
</div></div>

<div class="toast" id="toast"></div>

<!-- プラン選択シート -->
<div class="modalWrap" id="planModal">
  <div class="bd" data-close></div>
  <div class="sheet">
    <div class="grabber"></div>
    <h2>🧳 旅行プラン一覧</h2>
    <div class="planList" id="planList"></div>
    <button class="newPlanBtn" id="newPlanBtn">＋ 新しい旅行プランを作成</button>
    <div class="hlp">プラン一覧はスプレッドシートから直接取得しています。どの端末からも同じデータが見えます。</div>
  </div>
</div>

<script>
'use strict';

/* ============================================================
   ⚠️ ここに Apps Script Webアプリ の URL を貼り付け
   デプロイ後に取得した https://script.google.com/macros/s/…/exec
   ============================================================ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyoCoNQrSlS5HN3pM84RpAY_7Thp-6xLTwrzd6ZNrMRG9_CkuyYawpR6EdUGXdrjaU3ag/exec';
/* ============================================================ */

const MOVES=[{v:'walk',name:'徒歩',emoji:'🚶'},{v:'train',name:'電車',emoji:'🚆'},{v:'subway',name:'地下鉄',emoji:'🚇'},{v:'bus',name:'バス',emoji:'🚌'},{v:'taxi',name:'タクシー',emoji:'🚕'},{v:'bike',name:'自転車',emoji:'🚲'}];
const SUGGESTIONS=[{n:'浅草寺',cat:'寺社',e:'⛩️'},{n:'東京スカイツリー',cat:'展望',e:'🗼'},{n:'上野公園',cat:'公園',e:'🌳'},{n:'秋葉原',cat:'ショッピング',e:'🎮'},{n:'渋谷スクランブル交差点',cat:'名所',e:'🚦'},{n:'明治神宮',cat:'寺社',e:'⛩️'},{n:'東京駅',cat:'交通',e:'🚉'},{n:'皇居',cat:'名所',e:'🏯'},{n:'表参道ヒルズ',cat:'ショッピング',e:'🛍️'},{n:'豊洲市場',cat:'グルメ',e:'🐟'},{n:'お台場',cat:'観光',e:'🌉'},{n:'新宿御苑',cat:'公園',e:'🌸'},{n:'原宿',cat:'ショッピング',e:'🎀'},{n:'銀座',cat:'ショッピング',e:'💎'},{n:'六本木ヒルズ',cat:'展望',e:'🌃'}];

/* ============================================================
   Runtime state (メモリ内のみ、ローカル保存なし)
   ============================================================ */
let state = null;      // 現在編集中のプラン
let activeId = '';     // 現在編集中のプランID
let plans = [];        // クラウド一覧
let dragId = null;
let saveT = null;
let netStatus = 'online';
let loading = false;

/* ============================================================
   Utils
   ============================================================ */
const $=id=>document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML;}
function uid(){return 'i'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function normTime(s){s=String(s||'').trim();const m=s.match(/^(\d{1,2}):?(\d{2})$/);if(!m)return null;let h=parseInt(m[1],10),mi=parseInt(m[2],10);if(isNaN(h)||isNaN(mi))return null;if(h<0||h>23||mi<0||mi>59)return null;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');}
function toMin(t){const m=/^(\d{2}):(\d{2})$/.exec(t||'');if(!m)return 0;return parseInt(m[1],10)*60+parseInt(m[2],10);}
function activeDay(){if(!state)return null;return state.days.find(d=>d.id===state.activeDayId)||state.days[0];}

/* ============================================================
   Network status
   ============================================================ */
function updateNet(){
  const el=$('netInd');
  if(!GAS_URL||GAS_URL==='PASTE_YOUR_GAS_WEBAPP_URL_HERE'){el.className='netInd error';el.textContent='要設定';return;}
  if(!navigator.onLine){el.className='netInd offline';el.textContent='オフライン';netStatus='offline';return;}
  if(netStatus==='saving'){el.className='netInd saving';el.textContent='保存中…';return;}
  if(netStatus==='error'){el.className='netInd error';el.textContent='同期失敗';return;}
  el.className='netInd online';el.textContent='● オンライン';netStatus='online';
}

async function gasPost(body){
  if(!GAS_URL||GAS_URL==='PASTE_YOUR_GAS_WEBAPP_URL_HERE') throw new Error('GAS URL未設定');
  const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});
  const txt=await res.text();
  let j; try{j=JSON.parse(txt);}catch(e){throw new Error('応答不正: '+txt.slice(0,150));}
  if(!j.ok) throw new Error(j.error||'サーバーエラー');
  return j;
}
async function gasGet(params){
  if(!GAS_URL||GAS_URL==='PASTE_YOUR_GAS_WEBAPP_URL_HERE') throw new Error('GAS URL未設定');
  const q=new URLSearchParams(params).toString();
  const res=await fetch(GAS_URL+'?'+q,{redirect:'follow'});
  const txt=await res.text();
  let j; try{j=JSON.parse(txt);}catch(e){throw new Error('応答不正');}
  if(!j.ok) throw new Error(j.error||'サーバーエラー');
  return j;
}

/* ============================================================
   Cloud operations
   ============================================================ */
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(()=>doCloudSave(false),1000);}

async function doCloudSave(manual){
  if(!state||!activeId) return;
  if(!navigator.onLine){
    netStatus='offline'; updateNet();
    if(manual) toast('オフラインです。オンライン復帰後にもう一度保存してください');
    return;
  }
  try{
    netStatus='saving'; updateNet();
    const res = await gasPost({action:'save',planId:activeId,title:state.title,data:state});
    if(res.planId && res.planId !== activeId){
      activeId = res.planId;
    }
    // 一覧更新
    const p=plans.find(p=>p.planId===activeId);
    if(p){p.title=state.title;p.updatedAt=res.updatedAt||new Date().toISOString();}
    else{plans.unshift({planId:activeId,title:state.title,updatedAt:res.updatedAt,createdAt:new Date().toISOString()});}
    netStatus='online'; updateNet();
    if(manual) toast('☁ 保存しました');
  }catch(e){
    console.error(e);
    netStatus='error'; updateNet();
    if(manual) toast('同期失敗: '+(e.message||''));
    else toast('自動保存に失敗しました');
  }
}

async function refreshPlans(){
  try{
    const res = await gasGet({action:'list'});
    plans = res.plans||[];
    renderPlanList();
  }catch(e){
    toast('一覧取得失敗: '+e.message);
    renderPlanList();
  }
}

async function loadPlan(planId){
  loading = true;
  renderLoading();
  try{
    const res = await gasGet({action:'get',planId});
    if(res.plan && res.plan.data){
      state = res.plan.data;
      state.title = res.plan.title || state.title || '旅行計画';
      activeId = planId;
    } else {
      state = initialPlanData();
      activeId = planId;
    }
  }catch(e){
    toast('読み込み失敗: '+e.message);
    state = initialPlanData();
    activeId = planId;
  }
  loading = false;
  render();
  closeModal();
}

async function createPlan(title){
  loading = true;
  state = initialPlanData(title);
  activeId = ''; // GAS側で新規発行
  render();
  closeModal();
  // 即保存してplanIdを確定
  try{
    netStatus='saving'; updateNet();
    const res = await gasPost({action:'save',planId:'',title:state.title,data:state});
    activeId = res.planId;
    plans.unshift({planId:activeId,title:state.title,updatedAt:res.updatedAt,createdAt:new Date().toISOString()});
    netStatus='online'; updateNet();
    toast('新しいプランを作成しました');
  }catch(e){
    netStatus='error'; updateNet();
    toast('作成失敗: '+e.message);
  }
  loading = false;
  render();
}

async function deletePlan(planId,titleName){
  if(!confirm('「'+(titleName||planId)+'」を削除しますか？'))return;
  try{
    await gasPost({action:'delete',planId});
    plans = plans.filter(p=>p.planId!==planId);
    renderPlanList();
    toast('削除しました');
    if(activeId===planId){
      if(plans.length){ loadPlan(plans[0].planId); }
      else{ createPlan('新しい旅行'); }
    }
  }catch(e){
    toast('削除失敗: '+e.message);
  }
}

/* ============================================================
   Initial data
   ============================================================ */
function initialPlanData(title){
  const dayId=uid();
  return {
    title: title||'新しい旅行',
    activeDayId: dayId,
    days:[{id:dayId,name:'1日目',date:new Date().toISOString().slice(0,10),items:[]}]
  };
}

/* ============================================================
   Rendering
   ============================================================ */
function renderLoading(){
  $('timeline').innerHTML = '<div class="loadingBox"><span class="spin"></span>読み込み中…</div>';
}

function render(){
  if(!state) return;
  renderDayStrip();
  renderTimeline();
  renderSummary();
  $('tripTitle').textContent = state.title || '旅行計画';
  const p = plans.find(p=>p.planId===activeId);
  $('planCurName').textContent = p ? p.title : (state.title || 'プランを選ぶ');
}

function renderDayStrip(){
  const el=$('dayStrip');el.innerHTML='';
  state.days.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='dayChip'+(d.id===state.activeDayId?' act':'');
    b.textContent=d.name||('Day '+(i+1));
    b.onclick=()=>{state.activeDayId=d.id;render();scheduleSave();};
    b.oncontextmenu=(e)=>{e.preventDefault();renameDay(d);};
    el.appendChild(b);
  });
  const add=document.createElement('button');
  add.className='dayChip addDay';add.textContent='＋ 日を追加';add.onclick=addDay;
  el.appendChild(add);
}

function renderSummary(){
  const day=activeDay();if(!day)return;
  let cost=0,mv=0,cnt=day.items.length;
  day.items.forEach(it=>{if(it.type==='move'){cost+=Number(it.cost)||0;mv+=Number(it.duration)||0;}});
  $('sumCost').textContent='¥'+cost.toLocaleString('ja-JP');
  $('sumMove').textContent=(mv>=60?Math.floor(mv/60)+'時間'+(mv%60?(mv%60)+'分':''):mv+'分');
  $('sumCount').textContent=String(cnt);
}

function renderTimeline(){
  const wrap=$('timeline');wrap.innerHTML='';
  const day=activeDay();if(!day)return;
  if(!day.items.length){
    const e=document.createElement('div');e.className='empty';
    e.innerHTML='<div class="emoji">🧳</div><div class="t">まだ予定がありません</div><div class="s">下の＋ボタンか、検索欄から追加できます</div>';
    wrap.appendChild(e);return;
  }
  day.items.forEach(it=>wrap.appendChild(renderItem(it)));
}

function renderItem(it){
  const card=document.createElement('article');
  card.className='card '+(it.type==='dest'?'dest':'move');
  card.draggable=true;card.dataset.id=it.id;
  const grid=document.createElement('div');grid.className='cardGrid';
  const dh=document.createElement('div');dh.className='dragHandle';dh.innerHTML='⋮⋮';
  const ic=document.createElement('div');ic.className='cardIcon';
  ic.textContent=it.type==='dest'?(it.emoji||'📍'):(MOVES.find(m=>m.v===it.move)?.emoji||'🚶');
  const tc=document.createElement('div');tc.className='timeCol';
  const tIn=document.createElement('input');tIn.className='timeInput';tIn.type='time';tIn.value=it.time||'';tIn.step=60;
  tIn.addEventListener('change',()=>{const v=normTime(tIn.value);if(!v){toast('時刻の形式が正しくありません');tIn.value=it.time||'';return;}it.time=v;renderSummary();scheduleSave();});
  tc.appendChild(tIn);
  if(it.type==='move'&&it.duration){const b=document.createElement('div');b.className='durBadge';b.textContent='+'+it.duration+'分';tc.appendChild(b);}
  const body=document.createElement('div');body.className='body';
  if(it.type==='dest')buildDestBody(body,it);else buildMoveBody(body,it);
  grid.appendChild(dh);grid.appendChild(ic);grid.appendChild(tc);grid.appendChild(body);
  card.appendChild(grid);
  const actions=document.createElement('div');actions.className='cardActions';
  const del=document.createElement('button');del.className='actBtn';del.innerHTML='🗑';del.title='削除';del.setAttribute('aria-label','削除');
  del.onclick=(e)=>{e.stopPropagation();removeItem(it.id);};
  actions.appendChild(del);card.appendChild(actions);
  card.addEventListener('dragstart',(e)=>{dragId=it.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',it.id);}catch(_){}});
  card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.card.dragOver').forEach(c=>c.classList.remove('dragOver'));dragId=null;});
  card.addEventListener('dragover',(e)=>{e.preventDefault();if(dragId&&dragId!==it.id){card.classList.add('dragOver');e.dataTransfer.dropEffect='move';}});
  card.addEventListener('dragleave',()=>card.classList.remove('dragOver'));
  card.addEventListener('drop',(e)=>{e.preventDefault();card.classList.remove('dragOver');if(dragId&&dragId!==it.id)reorderItem(dragId,it.id);});
  let touchStartY=null;
  dh.addEventListener('touchstart',(e)=>{touchStartY=e.touches[0].clientY;},{passive:true});
  dh.addEventListener('touchmove',(e)=>{if(touchStartY===null)return;const dy=e.touches[0].clientY-touchStartY;if(Math.abs(dy)>40){moveItem(it.id,dy>0?1:-1);touchStartY=e.touches[0].clientY;}},{passive:true});
  dh.addEventListener('touchend',()=>{touchStartY=null;});
  return card;
}

function buildDestBody(body,it){
  const top=document.createElement('div');top.className='destTop';
  const lbl=document.createElement('span');lbl.className='destLbl';lbl.textContent='📍';
  const nm=document.createElement('input');nm.className='destName';nm.value=it.name||'';nm.placeholder='場所を入力';
  nm.addEventListener('input',()=>{it.name=nm.value;scheduleSave();});
  const pin=document.createElement('span');pin.className='mapPin';pin.textContent='🗺';pin.title='地図で開く';
  pin.onclick=(e)=>{e.stopPropagation();if(!it.name){toast('場所名を入力してください');return;}window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.name),'_blank');};
  top.appendChild(lbl);top.appendChild(nm);top.appendChild(pin);body.appendChild(top);
  const note=document.createElement('textarea');note.className='destNote';note.rows=1;note.placeholder='メモ（開館時間、予約情報など）';note.value=it.note||'';
  autoGrow(note);
  note.addEventListener('input',()=>{it.note=note.value;autoGrow(note);scheduleSave();});
  body.appendChild(note);
}
function autoGrow(t){t.style.height='auto';t.style.height=(t.scrollHeight)+'px';}

function buildMoveBody(body,it){
  const head=document.createElement('div');head.className='moveHead';
  const lbl=document.createElement('span');lbl.className='moveLbl';lbl.textContent='移動方法';
  const sel=document.createElement('select');sel.className='moveSelect';
  MOVES.forEach(m=>{const o=document.createElement('option');o.value=m.v;o.textContent=m.emoji+' '+m.name;if(it.move===m.v)o.selected=true;sel.appendChild(o);});
  sel.addEventListener('change',()=>{it.move=sel.value;render();scheduleSave();});
  head.appendChild(lbl);head.appendChild(sel);body.appendChild(head);
  const meta=document.createElement('div');meta.className='moveMeta';
  const g1=document.createElement('div');g1.className='metaGrp';
  const l1=document.createElement('span');l1.className='metaLbl';l1.textContent='所要';
  const i1=document.createElement('input');i1.className='metaInput';i1.type='number';i1.min='0';i1.step='5';i1.inputMode='numeric';i1.value=it.duration??'';i1.placeholder='0';
  const u1=document.createElement('span');u1.className='metaUnit';u1.textContent='分';
  i1.addEventListener('input',()=>{it.duration=i1.value===''?null:Math.max(0,parseInt(i1.value,10)||0);renderSummary();scheduleSave();});
  g1.appendChild(l1);g1.appendChild(i1);g1.appendChild(u1);
  const g2=document.createElement('div');g2.className='metaGrp';
  const l2=document.createElement('span');l2.className='metaLbl';l2.textContent='費用';
  const u2a=document.createElement('span');u2a.className='metaUnit';u2a.textContent='¥';
  const i2=document.createElement('input');i2.className='metaInput';i2.type='number';i2.min='0';i2.step='10';i2.inputMode='numeric';i2.value=it.cost??'';i2.placeholder='0';
  i2.addEventListener('input',()=>{it.cost=i2.value===''?null:Math.max(0,parseInt(i2.value,10)||0);renderSummary();scheduleSave();});
  g2.appendChild(l2);g2.appendChild(u2a);g2.appendChild(i2);
  meta.appendChild(g1);meta.appendChild(g2);body.appendChild(meta);
}

function renderPlanList(){
  const el=$('planList');el.innerHTML='';
  if(!plans.length){
    el.innerHTML='<div class="hlp" style="text-align:center;padding:12px">まだプランがありません。下のボタンから作成してください。</div>';
    return;
  }
  const sorted=plans.slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  sorted.forEach(p=>{
    const d=document.createElement('div');
    d.className='planItem'+(p.planId===activeId?' act':'');
    d.innerHTML='<div class="info"><div class="tt">'+esc(p.title||'無題プラン')+'</div><div class="mt">'+(p.updatedAt?'更新: '+new Date(p.updatedAt).toLocaleString('ja-JP'):'未同期')+'</div></div><button class="delBtn" title="削除">🗑</button>';
    d.querySelector('.info').onclick=()=>loadPlan(p.planId);
    d.querySelector('.delBtn').onclick=(e)=>{e.stopPropagation();deletePlan(p.planId,p.title);};
    el.appendChild(d);
  });
}

/* ============================================================
   Actions
   ============================================================ */
function addDay(){const id=uid();const n=state.days.length+1;const base=new Date();base.setDate(base.getDate()+state.days.length);state.days.push({id,name:n+'日目',date:base.toISOString().slice(0,10),items:[]});state.activeDayId=id;render();scheduleSave();toast('新しい日を追加しました');}
function renameDay(d){const nx=prompt('日程の名前を編集',d.name||'');if(nx===null)return;d.name=nx.trim()||d.name;render();scheduleSave();}
function addDest(name,emoji){const day=activeDay();const last=day.items[day.items.length-1];const time=last?nextTime(last):'10:00';day.items.push({id:uid(),type:'dest',time,name:name||'',note:'',emoji:emoji||'📍'});render();scheduleSave();scrollBottom();}
function addMove(){const day=activeDay();const last=day.items[day.items.length-1];const time=last?nextTime(last):'10:00';day.items.push({id:uid(),type:'move',time,move:'train',duration:15,cost:0});render();scheduleSave();scrollBottom();}
function nextTime(item){let m=toMin(item.time);if(item.type==='move'&&item.duration)m+=Number(item.duration)||0;else m+=30;m=Math.min(m,23*60+59);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function removeItem(id){const day=activeDay();const i=day.items.findIndex(x=>x.id===id);if(i<0)return;day.items.splice(i,1);render();scheduleSave();toast('削除しました');}
function reorderItem(srcId,dstId){const day=activeDay();const arr=day.items;const from=arr.findIndex(x=>x.id===srcId);const to=arr.findIndex(x=>x.id===dstId);if(from<0||to<0||from===to)return;const [m]=arr.splice(from,1);arr.splice(to,0,m);render();scheduleSave();}
function moveItem(id,dir){const arr=activeDay().items;const i=arr.findIndex(x=>x.id===id);if(i<0)return;const j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];render();scheduleSave();}
function openAddMenu(){const choice=confirm('OK=目的地を追加 / キャンセル=移動を追加');if(choice)addDest('','📍');else addMove();}

/* Suggest */
const sug=$('suggest');
function renderSuggest(q){q=(q||'').trim().toLowerCase();const list=q?SUGGESTIONS.filter(s=>s.n.toLowerCase().includes(q)||s.cat.toLowerCase().includes(q)):SUGGESTIONS.slice(0,8);if(!list.length){sug.classList.remove('show');return;}sug.innerHTML=list.map(s=>`<div class="sugItem" data-n="${esc(s.n)}" data-e="${esc(s.e)}"><span class="emoji">${esc(s.e)}</span><div><div class="nm">${esc(s.n)}</div><div class="cat">${esc(s.cat)}</div></div></div>`).join('');sug.classList.add('show');sug.querySelectorAll('.sugItem').forEach(el=>{el.onclick=()=>{addDest(el.dataset.n,el.dataset.e);$('searchInput').value='';sug.classList.remove('show');};});}

/* Toast & Modal */
let toastT=null;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2400);}
function scrollBottom(){setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),40);}
function openModal(id){$(id).classList.add('show');}
function closeModal(){document.querySelectorAll('.modalWrap').forEach(m=>m.classList.remove('show'));}
document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',closeModal));

/* Bindings */
$('addBtn').addEventListener('click',openAddMenu);
$('mapBtn').addEventListener('click',()=>{const names=activeDay().items.filter(x=>x.type==='dest'&&x.name).map(x=>x.name);if(!names.length){toast('目的地がありません');return;}window.open('https://www.google.com/maps/dir/'+names.map(encodeURIComponent).join('/'),'_blank');});
$('calBtn').addEventListener('click',()=>{const d=activeDay();const nx=prompt('日付を編集 (YYYY-MM-DD)',d.date||'');if(nx===null)return;if(/^\d{4}-\d{2}-\d{2}$/.test(nx.trim())){d.date=nx.trim();toast('日付を更新: '+d.date);scheduleSave();}else if(nx.trim()===''){d.date='';scheduleSave();}else toast('形式が正しくありません');});
$('tripTitle').addEventListener('blur',()=>{state.title=$('tripTitle').textContent.trim()||'旅行計画';const p=plans.find(p=>p.planId===activeId);if(p)p.title=state.title;renderDayStrip();$('planCurName').textContent=state.title;scheduleSave();});
$('tripTitle').addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();$('tripTitle').blur();}});
$('searchInput').addEventListener('input',(e)=>renderSuggest(e.target.value));
$('searchInput').addEventListener('focus',(e)=>renderSuggest(e.target.value));
$('searchInput').addEventListener('keydown',(e)=>{if(e.key==='Enter'){const v=e.target.value.trim();if(!v)return;const hit=SUGGESTIONS.find(s=>s.n===v);addDest(v,hit?hit.e:'📍');e.target.value='';sug.classList.remove('show');}});
document.addEventListener('click',(e)=>{if(!sug.contains(e.target)&&e.target!==$('searchInput'))sug.classList.remove('show');});
$('saveBtn').addEventListener('click',()=>doCloudSave(true));
$('reloadBtn').addEventListener('click',async()=>{if(activeId){await loadPlan(activeId);toast('再読み込みしました');}else{await refreshPlans();}});
$('planPickBtn').addEventListener('click',async()=>{openModal('planModal');await refreshPlans();});
$('newPlanBtn').addEventListener('click',()=>{const title=prompt('新しい旅行プラン名','新しい旅行');if(title===null)return;createPlan(title.trim()||'新しい旅行');});

window.addEventListener('online',()=>updateNet());
window.addEventListener('offline',()=>updateNet());

/* Service Worker */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW失敗',err));
  });
}

/* ============================================================
   Init: 起動時にスプレッドシートから一覧取得→最新プランを開く
   ============================================================ */
(async function init(){
  updateNet();
  if(!GAS_URL || GAS_URL==='PASTE_YOUR_GAS_WEBAPP_URL_HERE'){
    $('timeline').innerHTML = '<div class="empty"><div class="emoji">⚠️</div><div class="t">GAS URLが未設定です</div><div class="s">index.html の GAS_URL に Apps Script の Webアプリ URL を貼り付けてください</div></div>';
    return;
  }
  renderLoading();
  try{
    const res = await gasGet({action:'list'});
    plans = res.plans||[];
    if(plans.length){
      // 最新更新のプランを開く
      const latest = plans.slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''))[0];
      await loadPlan(latest.planId);
    } else {
      // プランがなければ新規作成
      await createPlan('東京旅行計画');
    }
  }catch(e){
    console.error(e);
    netStatus='error'; updateNet();
    $('timeline').innerHTML='<div class="empty"><div class="emoji">⚠️</div><div class="t">読み込み失敗</div><div class="s">'+esc(e.message)+'<br>右上の 🔄 で再試行してください</div></div>';
  }
})();
</script>
